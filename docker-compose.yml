# docker-compose para desenvolvimento usando Dockerfile local e SQLite
# Versão do compose (3.8 dá recursos modernos e compatibilidade com a maioria das versões do Docker)
version: '3.8'

services:
  app:
    # Constrói a imagem a partir do Dockerfile na raiz do projeto
    build:
      context: .
      dockerfile: Dockerfile

    # Mapeia o diretório do projeto para dentro do container para desenvolvimento ao vivo
    volumes:
      - ./:/var/www/html:delegated

    # Expõe portas para acessar a aplicação a partir do host
    ports:
      - "8000:8000"  # Laravel dev server (php artisan serve)
      - "5173:5173"  # Vite dev server (se usar)

    # Usar root facilita permissões durante dev (pode trocar para www-data ou UID do host se preferir)
    user: root

    # Reinicia automaticamente se o container falhar
    restart: unless-stopped

    # Evita que compose tente aguardar por outros serviços (SQLite não precisa de dependências)
    depends_on: []

# Se quiser mais serviços (ex: redis, mailhog) você pode adicioná-los aqui

